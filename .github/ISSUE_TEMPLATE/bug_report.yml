name: Баг-репорт
description: Сообщить об ошибке в работе приложения
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Пожалуйста, не добавляйте токены, cookies, реальные адреса порталов и персональные данные.
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опишите ошибку и ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть …
        2. Нажать …
        3. Получить …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения
      placeholder: например 2.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и версия Android
      placeholder: например Samsung A52, Android 13
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: При наличии — фрагмент логов (без персональных данных).
      render: shell
    validations:
      required: false
